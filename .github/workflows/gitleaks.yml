# Secret scanning with gitleaks — runs on push, pull requests, and manual dispatch.
# Detection only: it reports findings, it does not block.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

# gitleaks-action reads the PR's commits on pull_request events, which needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
